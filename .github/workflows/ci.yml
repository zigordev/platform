name: CI

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pipeline:
    name: Pipeline
    uses: zigordev/toolkit/.github/workflows/check.yml@a2a493dccd984127492814a037eedf470929c0e5 # v1.16.0
    permissions:
      contents: read
      security-events: write

  stack:
    name: Shared services
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      LEFTHOOK: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Start the shared services, as a laptop does
        run: |
          DOCKER_SOCKET_GROUP="$(stat -c %g /var/run/docker.sock)"
          export DOCKER_SOCKET_GROUP
          pnpm local:up

      - name: Open each local address
        run: |
          for address in grafana.localhost/api/health mail.localhost/readyz traefik.localhost/api/overview alloy.localhost/-/ready; do
            curl --fail --silent --show-error --output /dev/null --max-time 10 "http://$address"
            echo "http://$address answers"
          done

      - name: Send a trace from the machine itself, as an app outside a container does
        run: |
          trace_id="$(openssl rand -hex 16)"
          span_id="$(openssl rand -hex 8)"
          now="$(date +%s%N)"
          printf '{"resourceSpans":[{"resource":{"attributes":[{"key":"service.name","value":{"stringValue":"pipeline-probe"}}]},"scopeSpans":[{"spans":[{"traceId":"%s","spanId":"%s","name":"probe","kind":1,"startTimeUnixNano":"%s","endTimeUnixNano":"%s"}]}]}]}' "$trace_id" "$span_id" "$now" "$now" > trace.json
          curl --fail --silent --show-error --output /dev/null --max-time 10 --header 'Content-Type: application/json' --data @trace.json http://127.0.0.1:4318/v1/traces
          echo "http://127.0.0.1:4318 took the trace $trace_id"
          for attempt in $(seq 1 30); do
            if curl --fail --silent --output /dev/null --max-time 5 "http://grafana.localhost/api/datasources/proxy/uid/tempo/api/traces/$trace_id"; then
              echo "Grafana shows the trace after $attempt tries"
              exit 0
            fi
            sleep 2
          done
          echo "Grafana did not show the trace within a minute"
          exit 1

      - name: Show the containers when a step failed
        if: failure()
        working-directory: stack
        run: |
          docker compose --file compose.yaml --file compose.local.yaml ps --all
          docker compose --file compose.yaml --file compose.local.yaml logs --tail 40

      - name: Stop them
        if: always()
        run: pnpm local:down

  infra-plan:
    name: Infrastructure plan
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    outputs:
      apply: ${{ steps.plan.outputs.apply }}
    env:
      LEFTHOOK: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0

      - name: Sign in to AWS with the read-only role
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/platform-opentofu-plan
          role-session-name: platform-plan-${{ github.run_id }}
          aws-region: eu-west-1
          mask-aws-account-id: true

      - name: Plan every stack
        id: plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
        run: infra/run.sh plan

  check:
    name: check
    needs: [pipeline, stack, infra-plan]
    if: always()
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Pass only when every job passed
        env:
          PIPELINE: ${{ needs.pipeline.result }}
          STACK: ${{ needs.stack.result }}
          INFRA: ${{ needs.infra-plan.result }}
        run: |
          echo "The pipeline ended with: $PIPELINE"
          echo "The shared services ended with: $STACK"
          echo "The infrastructure plan ended with: $INFRA"
          test "$PIPELINE" = "success"
          test "$STACK" = "success"
          test "$INFRA" = "success"

  release:
    name: Release
    needs: [check]
    if: github.event_name == 'push'
    uses: zigordev/toolkit/.github/workflows/release.yml@a2a493dccd984127492814a037eedf470929c0e5 # v1.16.0
    permissions:
      contents: write
      id-token: write

  infra-apply:
    name: Infrastructure apply
    needs: [check, infra-plan]
    if: github.event_name == 'push' && needs.infra-plan.outputs.apply != ''
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    environment: infrastructure
    permissions:
      contents: read
      id-token: write
    env:
      LEFTHOOK: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0

      - name: Sign in to AWS with the apply role
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/platform-opentofu-apply
          role-session-name: platform-apply-${{ github.run_id }}
          aws-region: eu-west-1
          mask-aws-account-id: true

      - name: Apply every stack but the bootstrap
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
        run: infra/run.sh apply

  observability-changes:
    name: Observability changes
    if: github.event_name == 'push'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      push: ${{ steps.decide.outputs.push }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Decide whether the dashboards and alerts go to Grafana Cloud
        id: decide
        run: |
          enabled="$(jq -r .grafanaCloud observability/push.json)"
          changed="$(git diff --name-only HEAD~1 HEAD -- observability infra/grafana)"
          if [ "$enabled" = "true" ] && [ -n "$changed" ]; then
            echo "push=true" >> "$GITHUB_OUTPUT"
          else
            echo "push=false" >> "$GITHUB_OUTPUT"
          fi
          echo "The switch is $enabled, and the merge changed: ${changed:-nothing that is pushed}"

  observability-push:
    name: Observability push
    needs: [check, infra-apply, observability-changes]
    if: always() && needs.check.result == 'success' && needs.observability-changes.outputs.push == 'true' && (needs.infra-apply.result == 'success' || needs.infra-apply.result == 'skipped')
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    environment: infrastructure
    permissions:
      contents: read
      id-token: write
    env:
      LEFTHOOK: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build the dashboards and the alert rules
        run: pnpm --filter platform-observability run build

      - name: Sign in to AWS with the apply role
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/platform-opentofu-apply
          role-session-name: platform-observability-${{ github.run_id }}
          aws-region: eu-west-1
          mask-aws-account-id: true

      - name: Push them to Grafana Cloud, and delete what the files no longer hold
        run: |
          GRAFANA_SERVER="$(aws ssm get-parameter --name /platform/GRAFANA_URL --query Parameter.Value --output text)"
          GRAFANA_TOKEN="$(aws ssm get-parameter --name /platform/GRAFANA_STACK_TOKEN --with-decryption --query Parameter.Value --output text)"
          echo "::add-mask::$GRAFANA_TOKEN"
          export GRAFANA_SERVER GRAFANA_TOKEN
          pnpm --filter platform-observability run push
