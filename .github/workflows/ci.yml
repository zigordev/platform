name: CI

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pipeline:
    name: Pipeline
    uses: zigordev/toolkit/.github/workflows/check.yml@b38c72b34abfcaf66a3e5cc0cb4f44022d910f84 # v1.2.0
    permissions:
      contents: read
      security-events: write

  check:
    name: check
    needs: [pipeline]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Pass only when every job passed
        env:
          RESULT: ${{ needs.pipeline.result }}
        run: |
          echo "The pipeline ended with: $RESULT"
          test "$RESULT" = "success"

  release:
    name: Release
    needs: [check]
    if: github.event_name == 'push'
    uses: zigordev/toolkit/.github/workflows/release.yml@b38c72b34abfcaf66a3e5cc0cb4f44022d910f84 # v1.2.0
    permissions:
      contents: write
      id-token: write
