name: Security

on:
  schedule:
    - cron: "41 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: false

jobs:
  audit:
    name: Audit
    uses: zigordev/toolkit/.github/workflows/security-audit.yml@642caa98f0d3155512bb9efb2ffb5dfb163e7b77 # workflows-v0.3.0
    permissions:
      contents: read
      security-events: write
