name: Commitlint

on:
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: commitlint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commitlint:
    name: Commitlint
    uses: zigordev/toolkit/.github/workflows/commit-messages.yml@642caa98f0d3155512bb9efb2ffb5dfb163e7b77 # workflows-v0.3.0
    permissions:
      contents: read
      packages: read
