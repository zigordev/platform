name: platform-local

services:
  postgres:
    image: postgres:18.6-trixie
    container_name: platform-postgres
    user: postgres
    init: true
    security_opt: [no-new-privileges:true]
    stop_grace_period: 30s
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - 127.0.0.1:5432:5432
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: [CMD, pg_isready, --username=postgres, --dbname=postgres]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [zigordev]

  mailpit:
    image: axllent/mailpit:v1.33.1
    container_name: platform-mailpit
    user: "1000:1000"
    init: true
    security_opt: [no-new-privileges:true]
    stop_grace_period: 10s
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
    ports:
      - 127.0.0.1:1025:1025
      - 127.0.0.1:8025:8025
    healthcheck:
      test: [CMD, /mailpit, readyz]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [zigordev]

  lgtm:
    image: grafana/otel-lgtm:0.41.0
    container_name: platform-lgtm
    init: true
    security_opt: [no-new-privileges:true]
    stop_grace_period: 20s
    ports:
      - 127.0.0.1:3300:3000
    healthcheck:
      test: [CMD, /otel-lgtm/docker/healthcheck.sh]
      interval: 5s
      timeout: 5s
      retries: 60
    networks: [zigordev]

  alloy:
    image: grafana/alloy:v1.22.0
    container_name: platform-alloy
    init: true
    security_opt: [no-new-privileges:true]
    stop_grace_period: 20s
    command:
      [
        run,
        /etc/alloy/config.alloy,
        --storage.path=/var/lib/alloy/data,
        --server.http.listen-addr=0.0.0.0:12345,
      ]
    environment:
      OTLP_DESTINATION: http://lgtm:4318
      OTLP_USERNAME: local
      OTLP_PASSWORD: local
      LOKI_DESTINATION: http://lgtm:3100/loki/api/v1/push
      LOKI_USERNAME: local
      LOKI_PASSWORD: local
    ports:
      - 127.0.0.1:4317:4317
      - 127.0.0.1:4318:4318
    volumes:
      - ../stack/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data
    healthcheck:
      test:
        [
          CMD,
          bash,
          -c,
          "exec 3<>/dev/tcp/127.0.0.1/12345 && printf 'GET /-/ready HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q '200 OK' <&3",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
    depends_on:
      lgtm:
        condition: service_healthy
    networks: [zigordev]

networks:
  zigordev:
    name: zigordev

volumes:
  postgres-data:
  alloy-data:
