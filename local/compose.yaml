name: platform-local

services:
  postgres:
    image: postgres:18.6-trixie
    container_name: platform-postgres
    user: postgres
    init: true
    security_opt: [no-new-privileges:true]
    stop_grace_period: 30s
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - 127.0.0.1:5432:5432
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: [CMD, pg_isready, --username=postgres, --dbname=postgres]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [zigordev]

  mailpit:
    image: axllent/mailpit:v1.34.0
    container_name: platform-mailpit
    user: "1000:1000"
    init: true
    security_opt: [no-new-privileges:true]
    stop_grace_period: 10s
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
    ports:
      - 127.0.0.1:1025:1025
      - 127.0.0.1:8025:8025
    healthcheck:
      test: [CMD, /mailpit, readyz]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [zigordev]

  lgtm:
    image: grafana/otel-lgtm:0.41.0
    container_name: platform-lgtm
    init: true
    security_opt: [no-new-privileges:true]
    stop_grace_period: 20s
    environment:
      GF_SMTP_ENABLED: "true"
      GF_SMTP_HOST: mailpit:1025
      GF_SMTP_FROM_ADDRESS: grafana@platform.test
      GF_SMTP_FROM_NAME: Local Grafana
      GF_SMTP_STARTTLS_POLICY: NoStartTLS
      GF_SERVER_ROOT_URL: http://127.0.0.1:3300
      GRAFANA_ALERTING_SHA: ${GRAFANA_ALERTING_SHA:-}
    ports:
      - 127.0.0.1:3300:3000
    volumes:
      - ./grafana/provisioning/dashboards:/otel-lgtm/grafana/conf/provisioning/dashboards:ro
      - ./grafana/provisioning/alerting:/otel-lgtm/grafana/conf/provisioning/alerting:ro
      - ./grafana/dashboards:/etc/zigordev/dashboards:ro
      - lgtm-data:/data
    healthcheck:
      test: [CMD, /otel-lgtm/docker/healthcheck.sh]
      interval: 5s
      timeout: 5s
      retries: 60
    networks: [zigordev]

  alloy:
    image: grafana/alloy:v1.22.0
    container_name: platform-alloy
    init: true
    security_opt: [no-new-privileges:true]
    stop_grace_period: 20s
    command:
      [
        run,
        /etc/alloy/config.alloy,
        --storage.path=/var/lib/alloy/data,
        --server.http.listen-addr=0.0.0.0:12345,
      ]
    environment:
      OTLP_DESTINATION: http://lgtm:4318
      OTLP_USERNAME: local
      OTLP_PASSWORD: local
      LOKI_DESTINATION: http://lgtm:3100/loki/api/v1/push
      LOKI_USERNAME: local
      LOKI_PASSWORD: local
      FARO_ALLOWED_ORIGINS: "*"
      ALLOY_CONFIG_SHA: ${ALLOY_CONFIG_SHA:-}
    ports:
      - 127.0.0.1:4317:4317
      - 127.0.0.1:4318:4318
      - 127.0.0.1:12347:12347
    volumes:
      - ../stack/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data
    healthcheck:
      test:
        [
          CMD,
          bash,
          -c,
          "exec 3<>/dev/tcp/127.0.0.1/12345 && printf 'GET /-/ready HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q '200 OK' <&3",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
    depends_on:
      lgtm:
        condition: service_healthy
    networks: [zigordev]

  flagd:
    image: ghcr.io/open-feature/flagd:v0.19.0
    container_name: platform-flagd
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 10s
    command: [start, --sources, "${FLAGD_SOURCES:-[]}", --cors-origin, "*", --log-format, json]
    environment:
      OTEL_SERVICE_NAME: platform-flagd
      OTEL_METRICS_EXPORTER: otlp
      OTEL_EXPORTER_OTLP_ENDPOINT: http://alloy:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
    ports:
      - 127.0.0.1:8013:8013
      - 127.0.0.1:8014:8014
      - 127.0.0.1:8015:8015
      - 127.0.0.1:8016:8016
    volumes:
      - ../apps:/apps:ro
    depends_on:
      alloy:
        condition: service_healthy
    networks: [zigordev]

  notifications-api-migrate:
    image: ghcr.io/zigordev/notifications-api:0.3.0@sha256:833d1fd4c41de56402274e80fc7f18693e0b0cf60fc78b34e9b01722cd17f004
    container_name: platform-notifications-api-migrate
    command: [node, src/migrate.ts]
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      DATABASE_URL: postgresql://notifications_api@postgres:5432/notifications_api
    depends_on:
      postgres:
        condition: service_healthy
    networks: [zigordev]

  notifications-api:
    image: ghcr.io/zigordev/notifications-api:0.3.0@sha256:833d1fd4c41de56402274e80fc7f18693e0b0cf60fc78b34e9b01722cd17f004
    container_name: platform-notifications-api
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 30s
    env_file:
      - path: notifications-api.env
        required: false
    environment:
      DATABASE_URL: postgresql://notifications_api@postgres:5432/notifications_api
      OTEL_SERVICE_NAME: notifications-api
      OTEL_EXPORTER_OTLP_ENDPOINT: http://alloy:4318
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_SECURITY: none
    ports:
      - 127.0.0.1:3001:3000
    depends_on:
      notifications-api-migrate:
        condition: service_completed_successfully
      mailpit:
        condition: service_healthy
    networks: [zigordev]

networks:
  zigordev:
    name: zigordev

volumes:
  postgres-data:
  alloy-data:
  lgtm-data:
