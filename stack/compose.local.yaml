services:
  docker-proxy:
    user: "65534:${DOCKER_SOCKET_GROUP:-0}"

  traefik:
    environment:
      TRAEFIK_API: "true"
    ports:
      - 127.0.0.1:80:8080
      - "[::1]:80:8080"
    labels:
      traefik.enable: "true"
      traefik.http.routers.traefik.rule: Host(`traefik.localhost`)
      traefik.http.routers.traefik.service: api@internal

  alloy:
    ports:
      - 127.0.0.1:4318:4318
    environment:
      OTLP_DESTINATION: http://lgtm:4318
      OTLP_USERNAME: local
      OTLP_PASSWORD: local
      LOKI_DESTINATION: http://lgtm:3100/loki/api/v1/push
      LOKI_USERNAME: local
      LOKI_PASSWORD: local
      TEXTFILE_DIRECTORY: /tmp
    labels:
      traefik.enable: "true"
      traefik.http.routers.alloy.rule: Host(`alloy.localhost`)
      traefik.http.services.alloy.loadbalancer.server.port: "12345"

  lgtm:
    image: grafana/otel-lgtm:0.41.1@sha256:1b852b77d7bcadb7699bfe7c78a51d059dff85168de674728cf7abf4474645e5
    init: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 30s
    restart: unless-stopped
    mem_limit: 2g
    cpus: 2
    environment:
      GF_SERVER_ROOT_URL: http://grafana.localhost
    volumes:
      - lgtm-data:/data
    healthcheck:
      test: [CMD, /otel-lgtm/docker/healthcheck.sh]
      interval: 5s
      timeout: 5s
      retries: 60
    labels:
      traefik.enable: "true"
      traefik.http.routers.grafana.rule: Host(`grafana.localhost`)
      traefik.http.services.grafana.loadbalancer.server.port: "3000"
    networks: [zigordev]

  mailpit:
    image: axllent/mailpit:v1.34.0@sha256:23a2ef85bc50853ab3093645d1d64679afd8887e89da5e48a88940c172591a4e
    user: "1000:1000"
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 10s
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.5
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
    tmpfs:
      - /tmp
    healthcheck:
      test: [CMD, /mailpit, readyz]
      interval: 5s
      timeout: 3s
      retries: 12
    labels:
      traefik.enable: "true"
      traefik.http.routers.mail.rule: Host(`mail.localhost`)
      traefik.http.services.mail.loadbalancer.server.port: "8025"
    networks: [zigordev]

  gcx:
    image: grafana/gcx:v1.8.0@sha256:58347c68228ebc5f36a86bfbdbe353c90aa9452cb961da40ec669e00c8361446
    profiles: [push]
    restart: "no"
    command: [resources, push, --path, /resources, --on-error, abort]
    user: "65532:65532"
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 10s
    mem_limit: 128m
    cpus: 0.5
    environment:
      GRAFANA_SERVER: http://lgtm:3000
      GRAFANA_ORG_ID: "1"
      GRAFANA_USER: admin
      GRAFANA_PASSWORD: admin
      GCX_TELEMETRY: disabled
      GCX_KEYCHAIN: "off"
    tmpfs:
      - /home/nonroot/.config
    volumes:
      - ./observability:/resources:ro
    depends_on:
      lgtm:
        condition: service_healthy
    networks: [zigordev]

volumes:
  lgtm-data:
