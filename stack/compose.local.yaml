services:
  docker-proxy:
    user: "65534:${DOCKER_SOCKET_GROUP:-0}"

  traefik:
    environment:
      TRAEFIK_API: "true"
    ports:
      - 127.0.0.1:80:8080
      - "[::1]:80:8080"
    labels:
      traefik.enable: "true"
      traefik.http.routers.traefik.rule: Host(`traefik.localhost`)
      traefik.http.routers.traefik.service: api@internal

  alloy:
    ports:
      - 127.0.0.1:4318:4318
    environment:
      OTLP_DESTINATION: http://lgtm:4318
      OTLP_USERNAME: local
      OTLP_PASSWORD: local
      LOKI_DESTINATION: http://lgtm:3100/loki/api/v1/push
      LOKI_USERNAME: local
      LOKI_PASSWORD: local
      TEXTFILE_DIRECTORY: /tmp
    labels:
      traefik.enable: "true"
      traefik.http.routers.alloy.rule: Host(`alloy.localhost`)
      traefik.http.services.alloy.loadbalancer.server.port: "12345"

  kafka:
    ports:
      - 127.0.0.1:9094:9094
      - "[::1]:9094:9094"
    environment:
      KAFKA_LISTENERS: SASL_PLAINTEXT://:9092,CONTROLLER://localhost:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: SASL_PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,SASL_PLAINTEXT:SASL_PLAINTEXT,EXTERNAL:SASL_PLAINTEXT
      KAFKA_LISTENER_NAME_EXTERNAL_SCRAM___SHA___512_SASL_JAAS_CONFIG: org.apache.kafka.common.security.scram.ScramLoginModule required;
      KAFKA_ADMIN_PASSWORD: local-only-admin
      KAFKA_SETUP_PASSWORD: local-only-setup

  kafka-setup:
    profiles: [setup]
    environment:
      KAFKA_SETUP_PASSWORD: local-only-setup
      KAFKA_SETUP_LAPTOP: |
        user template-api
        allow template-api Write topic notifications.requests.template-api
        allow template-api Read topic notifications.outcomes.template-api
        allow template-api Write topic notifications.outcomes.template-api.dead-letter
        allow template-api Read group template-api. prefixed
      KAFKA_PASSWORD_NOTIFICATIONS_API: local-only-notifications-api
      KAFKA_PASSWORD_TEMPLATE_API: local-only-template-api

  lgtm:
    image: grafana/otel-lgtm:0.41.1@sha256:1b852b77d7bcadb7699bfe7c78a51d059dff85168de674728cf7abf4474645e5
    init: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 30s
    restart: unless-stopped
    mem_limit: 2g
    cpus: 2
    environment:
      GF_SERVER_ROOT_URL: http://grafana.localhost
    volumes:
      - lgtm-data:/data
    healthcheck:
      test: [CMD, /otel-lgtm/docker/healthcheck.sh]
      interval: 5s
      timeout: 5s
      retries: 60
    labels:
      traefik.enable: "true"
      traefik.http.routers.grafana.rule: Host(`grafana.localhost`)
      traefik.http.services.grafana.loadbalancer.server.port: "3000"
    networks: [zigordev]

  mailpit:
    image: axllent/mailpit:v1.34.0@sha256:23a2ef85bc50853ab3093645d1d64679afd8887e89da5e48a88940c172591a4e
    user: "1000:1000"
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 10s
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.5
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
    tmpfs:
      - /tmp
    healthcheck:
      test: [CMD, /mailpit, readyz]
      interval: 5s
      timeout: 3s
      retries: 12
    labels:
      traefik.enable: "true"
      traefik.http.routers.mail.rule: Host(`mail.localhost`)
      traefik.http.services.mail.loadbalancer.server.port: "8025"
    networks: [zigordev]

  gcx:
    image: grafana/gcx:v1.8.0@sha256:58347c68228ebc5f36a86bfbdbe353c90aa9452cb961da40ec669e00c8361446
    profiles: [push]
    restart: "no"
    command: [resources, push, --path, /resources, --on-error, abort]
    user: "65532:65532"
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 10s
    mem_limit: 128m
    cpus: 0.5
    environment:
      GRAFANA_SERVER: http://lgtm:3000
      GRAFANA_ORG_ID: "1"
      GRAFANA_USER: admin
      GRAFANA_PASSWORD: admin
      GCX_TELEMETRY: disabled
      GCX_KEYCHAIN: "off"
    tmpfs:
      - /home/nonroot/.config
    volumes:
      - ./observability:/resources:ro
    depends_on:
      lgtm:
        condition: service_healthy
    networks: [zigordev]

  notifications-api:
    image: ghcr.io/zigordev/notifications-api:282146ba160fce8374cf3b827b475229522e7f59@sha256:eb4fef5f7f72a7dae9f18bb931050080ee02c52f9a194ff453929590ada09d74
    profiles: [notifications]
    restart: unless-stopped
    user: "1000:1000"
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 30s
    mem_limit: 256m
    cpus: 1
    environment:
      PORT: "3000"
      OTEL_SERVICE_NAME: notifications-api
      OTEL_SERVICE_VERSION: 282146ba160fce8374cf3b827b475229522e7f59
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment.name=local
      OTEL_EXPORTER_OTLP_ENDPOINT: http://alloy:4318
      DATABASE_URL: postgresql://notifications_api:local-only@notifications-postgres:5432/notifications_api
      KAFKA_BROKERS: kafka:9092
      KAFKA_USERNAME: notifications-api
      KAFKA_PASSWORD: local-only-notifications-api
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_SECURITY: none
    depends_on:
      notifications-api-migrate:
        condition: service_completed_successfully
    tmpfs:
      - /tmp:uid=1000,gid=1000,size=1m
    healthcheck:
      test: [CMD, wget, -q, -T, "4", -O, /dev/null, http://127.0.0.1:3000/health]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 2s
    networks: [zigordev, notifications]

  notifications-api-migrate:
    image: ghcr.io/zigordev/notifications-api:282146ba160fce8374cf3b827b475229522e7f59@sha256:eb4fef5f7f72a7dae9f18bb931050080ee02c52f9a194ff453929590ada09d74
    profiles: [notifications]
    command: [node, src/migrate.ts]
    restart: "no"
    user: "1000:1000"
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 10s
    mem_limit: 128m
    cpus: 1
    environment:
      OTEL_SERVICE_NAME: notifications-api-migrate
      OTEL_SERVICE_VERSION: 282146ba160fce8374cf3b827b475229522e7f59
      DATABASE_URL: postgresql://notifications_api:local-only@notifications-postgres:5432/notifications_api
      DATABASE_ADMIN_URL: postgresql://postgres:local-only@notifications-postgres:5432/postgres
    labels:
      com.zigordev.job: migrate
    depends_on:
      notifications-postgres:
        condition: service_healthy
    networks: [zigordev, notifications]

  notifications-postgres:
    image: postgres:18.7-alpine3.24@sha256:0115267ab5a509022df9319c77be365cef335adb71556c75f60f5360ee247e71
    profiles: [notifications]
    restart: unless-stopped
    init: true
    security_opt: [no-new-privileges:true]
    stop_grace_period: 30s
    mem_limit: 256m
    cpus: 1
    environment:
      POSTGRES_PASSWORD: local-only
    volumes:
      - notifications-postgres-data:/var/lib/postgresql
    healthcheck:
      test: [CMD, pg_isready, --username=postgres, --dbname=postgres]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
      start_interval: 1s
    networks: [notifications]

networks:
  notifications: {}

volumes:
  lgtm-data:
  notifications-postgres-data:
