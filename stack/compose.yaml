name: platform

services:
  docker-proxy:
    image: wollomatic/socket-proxy:1.14.0@sha256:fead157c4de4092461267092be49c993c2e6dd296a54c89ed04b8c870016b045
    command:
      - -loglevel=info
      - -logjson
      - -listenip=0.0.0.0
      - -allowfrom=traefik,alloy
      - -allowGET=/v1\..{1,2}/(version|info|events.*|containers/json.*|containers/[^/]+/json|containers/[^/]+/logs.*|networks.*)
      - -allowHEAD=/_ping
      - -allowhealthcheck
      - -shutdowngracetime=5
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 10s
    restart: unless-stopped
    mem_limit: 64m
    cpus: 0.25
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    healthcheck:
      test: [CMD, ./healthcheck]
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [docker]

  traefik:
    image: traefik:v3.8.0@sha256:00c9734983e74ae35a1fc18eaee9e9da13f3dde95c4e45b3b8c3b60e0dbd2d17
    user: "65532:65532"
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 30s
    restart: unless-stopped
    mem_limit: 128m
    cpus: 1
    environment:
      USER: traefik
      TRAEFIK_GLOBAL_CHECKNEWVERSION: "false"
      TRAEFIK_GLOBAL_SENDANONYMOUSUSAGE: "false"
      TRAEFIK_GLOBAL_ALIASHEADERSSTRATEGY: delete
      TRAEFIK_LOG_LEVEL: INFO
      TRAEFIK_LOG_FORMAT: json
      TRAEFIK_ENTRYPOINTS_WEB_ADDRESS: ":8080"
      TRAEFIK_ENTRYPOINTS_PING_ADDRESS: ":8082"
      TRAEFIK_PING: "true"
      TRAEFIK_PING_ENTRYPOINT: ping
      TRAEFIK_PROVIDERS_DOCKER: "true"
      TRAEFIK_PROVIDERS_DOCKER_ENDPOINT: tcp://docker-proxy:2375
      TRAEFIK_PROVIDERS_DOCKER_EXPOSEDBYDEFAULT: "false"
      TRAEFIK_PROVIDERS_DOCKER_NETWORK: zigordev
      TRAEFIK_METRICS_OTLP: "true"
      TRAEFIK_METRICS_OTLP_HTTP_ENDPOINT: http://alloy:4318/v1/metrics
    healthcheck:
      test: [CMD, traefik, healthcheck]
      interval: 5s
      timeout: 3s
      retries: 12
    depends_on:
      docker-proxy:
        condition: service_healthy
    networks: [zigordev, docker]

  alloy:
    image: grafana/alloy:v1.22.0@sha256:9acc2529bc1edb7f5b2bd801dd8334ebc80c158e3a9e5526ecd7c9a273d43189
    entrypoint:
      - sh
      - -c
      - printf '%s' "$$ALLOY_CONFIG" > /tmp/config.alloy && exec alloy "$$@"
      - alloy
    command:
      - run
      - /tmp/config.alloy
      - --storage.path=/var/lib/alloy/data
      - --server.http.listen-addr=0.0.0.0:12345
      - --disable-reporting
    user: "473:473"
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 20s
    restart: unless-stopped
    mem_limit: 256m
    cpus: 1
    environment:
      DOCKER_HOST: tcp://docker-proxy:2375
      ALLOY_CONFIG: |
        otelcol.receiver.otlp "apps" {
          grpc {
            endpoint = "0.0.0.0:4317"
          }

          http {
            endpoint = "0.0.0.0:4318"
          }

          output {
            metrics = [otelcol.processor.batch.apps.input]
            logs    = [otelcol.processor.batch.apps.input]
            traces  = [otelcol.processor.batch.apps.input]
          }
        }

        otelcol.processor.batch "apps" {
          output {
            metrics = [otelcol.exporter.otlphttp.destination.input]
            logs    = [otelcol.exporter.otlphttp.destination.input]
            traces  = [otelcol.exporter.otlphttp.destination.input]
          }
        }

        otelcol.auth.basic "destination" {
          username = sys.env("OTLP_USERNAME")
          password = sys.env("OTLP_PASSWORD")
        }

        otelcol.exporter.otlphttp "destination" {
          client {
            endpoint = sys.env("OTLP_DESTINATION")
            auth     = otelcol.auth.basic.destination.handler
          }
        }

        discovery.docker "containers" {
          host             = sys.env("DOCKER_HOST")
          refresh_interval = "5s"

          filter {
            name   = "network"
            values = ["zigordev", "zigordev-docker"]
          }
        }

        discovery.relabel "containers" {
          targets = discovery.docker.containers.targets

          rule {
            source_labels = ["__meta_docker_container_label_com_docker_compose_service"]
            target_label  = "service_name"
          }

          rule {
            source_labels = ["__meta_docker_container_label_com_docker_compose_project"]
            target_label  = "compose_project"
          }

          rule {
            source_labels = ["__meta_docker_container_name"]
            regex         = "/(.*)"
            target_label  = "container"
          }
        }

        loki.source.docker "containers" {
          host       = sys.env("DOCKER_HOST")
          targets    = discovery.relabel.containers.output
          forward_to = [loki.process.containers.receiver]
        }

        loki.process "containers" {
          forward_to = [loki.write.destination.receiver]

          stage.json {
            expressions = { trace_id = "traceId" }
          }

          stage.structured_metadata {
            values = { trace_id = "" }
          }
        }

        loki.write "destination" {
          endpoint {
            url = sys.env("LOKI_DESTINATION")

            basic_auth {
              username = sys.env("LOKI_USERNAME")
              password = sys.env("LOKI_PASSWORD")
            }
          }
        }

        prometheus.exporter.self "alloy" { }

        prometheus.exporter.unix "host" {
          procfs_path    = "/host/proc"
          sysfs_path     = "/host/sys"
          rootfs_path    = "/host/root"
          set_collectors = ["cpu", "meminfo", "filesystem", "textfile"]

          textfile {
            directory = sys.env("TEXTFILE_DIRECTORY")
          }
        }

        prometheus.exporter.blackbox "kafka" {
          config = "{ modules: { tcp: { prober: tcp, timeout: 5s } } }"

          target {
            name    = "kafka"
            address = "kafka:9092"
            module  = "tcp"
          }
        }

        prometheus.scrape "machine" {
          targets = array.concat(
            prometheus.exporter.self.alloy.targets,
            prometheus.exporter.unix.host.targets,
            prometheus.exporter.blackbox.kafka.targets,
          )
          scrape_interval = "60s"
          forward_to      = [prometheus.relabel.machine.receiver]
        }

        prometheus.relabel "machine" {
          forward_to = [otelcol.receiver.prometheus.machine.receiver]

          rule {
            source_labels = ["__name__", "mode", "fstype"]
            regex         = "alloy_build_info;;|node_cpu_seconds_total;idle;|node_memory_(MemTotal|MemAvailable)_bytes;;|node_filesystem_(size|avail)_bytes;;(ext4|xfs)|container_(memory_working_set|spec_memory_limit)_bytes;;|platform_backup_(last_success_timestamp_seconds|size_bytes);;|platform_restore_test_(last_success_timestamp_seconds|tables);;|probe_success;;"
            action        = "keep"
          }

          rule {
            source_labels = ["job"]
            regex         = "integrations/self"
            target_label  = "job"
            replacement   = "alloy"
          }

          rule {
            source_labels = ["job"]
            regex         = "integrations/unix"
            target_label  = "job"
            replacement   = "host"
          }

          rule {
            source_labels = ["job"]
            regex         = "integrations/blackbox/kafka"
            target_label  = "job"
            replacement   = "kafka"
          }
        }

        otelcol.receiver.prometheus "machine" {
          output {
            metrics = [otelcol.processor.batch.apps.input]
          }
        }
    tmpfs:
      - /tmp
    volumes:
      - alloy-data:/var/lib/alloy/data
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - exec 3<>/dev/tcp/127.0.0.1/12345 && printf 'GET /-/ready HTTP/1.0\r\n\r\n' >&3 && grep -q '200 OK' <&3
      interval: 5s
      timeout: 3s
      retries: 12
    depends_on:
      docker-proxy:
        condition: service_healthy
    networks: [zigordev, docker]

  kafka:
    image: apache/kafka:4.4.0@sha256:833b867a9585a141da455dc2b57431c65cbccb27f11c91f694444cca9f777e0f
    command:
      - bash
      - -c
      - |
        set -euo pipefail
        export KAFKA_LISTENER_NAME_SASL__PLAINTEXT_SCRAM___SHA___512_SASL_JAAS_CONFIG="org.apache.kafka.common.security.scram.ScramLoginModule required username=\"admin\" password=\"$${KAFKA_ADMIN_PASSWORD}\";"
        printf '%s\n' \
          "process.roles=$${KAFKA_PROCESS_ROLES}" \
          "node.id=$${KAFKA_NODE_ID}" \
          "controller.quorum.voters=$${KAFKA_CONTROLLER_QUORUM_VOTERS}" \
          "controller.listener.names=$${KAFKA_CONTROLLER_LISTENER_NAMES}" \
          "listeners=$${KAFKA_LISTENERS}" \
          "advertised.listeners=$${KAFKA_ADVERTISED_LISTENERS}" \
          "listener.security.protocol.map=$${KAFKA_LISTENER_SECURITY_PROTOCOL_MAP}" \
          "inter.broker.listener.name=$${KAFKA_INTER_BROKER_LISTENER_NAME}" \
          "sasl.enabled.mechanisms=$${KAFKA_SASL_ENABLED_MECHANISMS}" \
          "sasl.mechanism.inter.broker.protocol=$${KAFKA_SASL_MECHANISM_INTER_BROKER_PROTOCOL}" \
          "log.dirs=$${KAFKA_LOG_DIRS}" > /tmp/format.properties
        KAFKA_LOG4J_OPTS=-Dlog4j2.configurationFile=/etc/kafka/docker/tools-log4j2.yaml \
          /opt/kafka/bin/kafka-storage.sh format --ignore-formatted -t "$${CLUSTER_ID}" -c /tmp/format.properties \
          --add-scram "SCRAM-SHA-512=[name=admin,password=$${KAFKA_ADMIN_PASSWORD}]" \
          --add-scram "SCRAM-SHA-512=[name=setup,password=$${KAFKA_SETUP_PASSWORD}]"
        rm /tmp/format.properties
        exec /etc/kafka/docker/run
    user: "1000:1000"
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 30s
    restart: unless-stopped
    mem_limit: 1g
    cpus: 1
    environment:
      CLUSTER_ID: zxDw5kpHRNCfbBLbNLddOw
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: SASL_PLAINTEXT://:9092,CONTROLLER://localhost:9093
      KAFKA_ADVERTISED_LISTENERS: SASL_PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,SASL_PLAINTEXT:SASL_PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: SASL_PLAINTEXT
      KAFKA_SASL_ENABLED_MECHANISMS: SCRAM-SHA-512
      KAFKA_SASL_MECHANISM_INTER_BROKER_PROTOCOL: SCRAM-SHA-512
      KAFKA_OPTS: -Djava.security.auth.login.config=/dev/null
      KAFKA_AUTHORIZER_CLASS_NAME: org.apache.kafka.metadata.authorizer.StandardAuthorizer
      KAFKA_SUPER_USERS: User:admin;User:setup;User:ANONYMOUS
      KAFKA_ALLOW_EVERYONE_IF_NO_ACL_FOUND: "false"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms512m -Xmx512m
      KAFKA_JMX_OPTS: " "
    tmpfs:
      - /tmp
      - /opt/kafka/config:uid=1000,gid=1000
      - /opt/kafka/logs:uid=1000,gid=1000
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: [CMD, bash, -c, "exec 3<>/dev/tcp/127.0.0.1/9092"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 60s
      start_interval: 2s
    networks: [zigordev]

  kafka-setup:
    image: apache/kafka:4.4.0@sha256:833b867a9585a141da455dc2b57431c65cbccb27f11c91f694444cca9f777e0f
    command:
      - bash
      - -c
      - |
        set -euo pipefail
        bin=/opt/kafka/bin
        server=kafka:9092
        printf '%s\n' "security.protocol=SASL_PLAINTEXT" "sasl.mechanism=SCRAM-SHA-512" \
          "sasl.jaas.config=org.apache.kafka.common.security.scram.ScramLoginModule required username=\"setup\" password=\"$${KAFKA_SETUP_PASSWORD}\";" \
          > /tmp/setup.properties
        sign_in=(--bootstrap-server "$$server" --command-config /tmp/setup.properties)
        "$$bin/kafka-topics.sh" "$${sign_in[@]}" --list > /dev/null
        while read -r verb first second third fourth fifth; do
          case "$$verb" in
            '') ;;
            topic)
              "$$bin/kafka-topics.sh" "$${sign_in[@]}" --create --if-not-exists --topic "$$first" \
                --partitions "$$second" --replication-factor 1 > /dev/null
              echo "kafka-setup: topic $$first"
              ;;
            user)
              variable="KAFKA_PASSWORD_$$(printf '%s' "$$first" | tr 'a-z-' 'A-Z_')"
              password="$${!variable:-}"
              if [ -z "$$password" ]; then
                echo "kafka-setup: $$variable is not set, so the user $$first cannot sign in" >&2
                exit 1
              fi
              "$$bin/kafka-configs.sh" "$${sign_in[@]}" --alter --entity-type users --entity-name "$$first" \
                --add-config "SCRAM-SHA-512=[password=$$password]" > /dev/null
              echo "kafka-setup: user $$first"
              ;;
            allow)
              pattern=literal
              if [ "$${fifth:-}" = prefixed ]; then
                pattern=prefixed
              fi
              "$$bin/kafka-acls.sh" "$${sign_in[@]}" --add --allow-principal "User:$$first" \
                --operation "$$second" "--$$third" "$$fourth" --resource-pattern-type "$$pattern" > /dev/null
              echo "kafka-setup: $$first may $$second $$third $$fourth ($$pattern)"
              ;;
            *)
              echo "kafka-setup: unknown line: $$verb $$first" >&2
              exit 1
              ;;
          esac
        done <<< "$${KAFKA_SETUP:-}"
        echo "kafka-setup: done"
    user: "1000:1000"
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 10s
    restart: "no"
    mem_limit: 512m
    cpus: 0.5
    environment:
      KAFKA_HEAP_OPTS: -Xms128m -Xmx256m
      KAFKA_SETUP: ""
    tmpfs:
      - /tmp
      - /opt/kafka/logs:uid=1000,gid=1000
    labels:
      com.zigordev.job: migrate
    depends_on:
      kafka:
        condition: service_healthy
    networks: [zigordev]

networks:
  zigordev:
    name: zigordev
  docker:
    name: zigordev-docker
    internal: true

volumes:
  alloy-data:
  kafka-data:
